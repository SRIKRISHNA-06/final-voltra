services:
  postgres:
    image: postgres:16-alpine
    container_name: voltra-postgres
    environment:
      POSTGRES_DB: voltradb
      POSTGRES_USER: ${DB_USER:-voltra_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-voltra_pg_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - voltra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-voltra_user} -d voltradb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: voltra-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: voltra-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/voltradb
      DB_USER: ${DB_USER:-voltra_user}
      DB_PASSWORD: ${DB_PASSWORD:-voltra_pg_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-VoltraEnterprise256BitJwtSigningSecretKeyChangeInProd2026!}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-voltra_esp32_ocpp_gateway_key_2026}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@voltra.in}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-AdminPass123}

volumes:
  voltra_pgdata:
