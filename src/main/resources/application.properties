server.port=8080
spring.application.name=VOLTRA-EV-Platform

# Production PostgreSQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=false

# Redis Token Blacklist
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
voltra.redis.enabled=${REDIS_ENABLED:true}

# Security & Secrets
voltra.jwt.secret=${JWT_SECRET}
voltra.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
voltra.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# Razorpay Payment Gateway (Test or Live Mode)
voltra.razorpay.key-id=${RAZORPAY_KEY_ID:}
voltra.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
voltra.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
voltra.platform.commission-rate=${PLATFORM_COMMISSION_RATE:0.12}

# IoT / ESP32 / OCPP Meter Telemetry API Key
voltra.device.api-key=${DEVICE_API_KEY:}

# Optional Initial Admin Bootstrap
voltra.admin.email=${ADMIN_BOOTSTRAP_EMAIL:}
voltra.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:}

server.error.include-stacktrace=never
server.error.include-message=never
