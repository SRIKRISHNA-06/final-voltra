# Local Dev Profile (H2 + Flyway + Seeded Demo Stations)
spring.datasource.url=${DB_URL:jdbc:h2:mem:voltradb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

voltra.redis.enabled=false
voltra.jwt.secret=${JWT_SECRET:VoltraDevOnlyLocal256BitSigningKeyForEVNetwork2026!@#}
voltra.jwt.expiration-ms=7200000
voltra.device.api-key=${DEVICE_API_KEY:voltra_dev_meter_key_2026}
voltra.admin.email=${ADMIN_BOOTSTRAP_EMAIL:admin@voltra.in}
voltra.admin.password=${ADMIN_BOOTSTRAP_PASSWORD:AdminPass123}
